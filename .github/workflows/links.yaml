---
name: Lychee link checker

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 3 AM UTC to catch broken links
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  link-checker:
    name: Lychee link checker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize submodules
        run: |
          git submodule init
          git submodule update --recursive
          ls -la submodules/

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Create virtual environment
        run: |
          uv venv --clear .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install ".[docs]"
          uv pip install "submodules/hed-python[docs]"
          uv pip install "submodules/hed-vis[docs]"
          uv pip install "submodules/table-remodeler[docs]"
          uv pip install "submodules/hed-schemas[docs]"
          uv pip install "submodules/hed-matlab[docs]"
          uv pip install "submodules/hed-server[docs]"
          uv pip install "submodules/hed-tests[docs]"
          uv pip install "submodules/ndx-hed"

      - name: Build documentation with Sphinx
        run: |
          python docs/build_unified.py
          sphinx-build -b html docs/source docs/_build/html

      - name: Link Checker on built documentation
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Check this repo's own built pages only - the top-level *.html files.
          # Every subdirectory under docs/_build/html/ is either _modules/
          # (autodoc output) or a copy of a submodule's documentation, and each
          # submodule runs its own link check. Checking them here duplicates that
          # work, reports failures nobody in this repo can fix, and made the job
          # 9x slower.
          #
          # No --verbose: it prints a line for every checked AND every excluded
          # link. lychee.toml excludes 'file://', so each internal link between
          # built pages prints too - with submodules in scope that was ~135k
          # lines, which GitHub truncates, hiding the actual errors at the end.
          # Without it lychee prints only the failures, the file each one is in,
          # and a summary. Add --verbose back temporarily when diagnosing a
          # specific link, not as the standing configuration.
          args: --config lychee.toml --no-progress --max-redirects 10 'docs/_build/html/*.html'
          fail: true
