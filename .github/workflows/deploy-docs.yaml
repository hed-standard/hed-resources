name: Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      
      - name: Initialize and update submodules
        run: |
          git submodule update --init --recursive --remote --merge
          ls -la submodules/

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Create virtual environment
        run: |
          uv venv --clear .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install ".[docs]"
          uv pip install "submodules/hed-python[docs]"
          uv pip install "submodules/hed-vis[docs]"
          uv pip install "submodules/table-remodeler[docs]"
          uv pip install "submodules/hed-schemas[docs]"
          uv pip install "submodules/hed-matlab[docs]"
          uv pip install "submodules/hed-server[docs]"
          uv pip install "submodules/hed-tests[docs]"
          uv pip install "submodules/ndx-hed"

      - name: Cache Sphinx build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/_build
          key: sphinx-${{ runner.os }}-${{ hashFiles('docs/source/**/*', 'pyproject.toml') }}
          restore-keys: |
            sphinx-${{ runner.os }}-

      - name: Build documentation with Sphinx
        run: |
          python docs/build_unified.py
          sphinx-build -b html docs/source docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
