[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[project]
name = "hed-resources"
version = "1.0.0"
description = "Documentation and user resources for Hierarchical Event Descriptors (HED)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "HED Working Group", email = "hed.maintainers@gmail.com"},
    {name = "Kay Robbins"},
    {name = "Seyed Yahya Shirazi"},
]
maintainers = [
    {name = "HED Maintainers", email = "hed.maintainers@gmail.com"},
    {name = "Kay A. Robbins"},
    {name = "Seyed Yahya Shirazi"},
]
keywords = [
    "HED", 
    "hierarchical event descriptors", 
    "neuroscience", 
    "EEG", 
    "documentation",
    "BIDS"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hed-build-docs = "scripts.build_docs:main"
hed-serve-docs = "scripts.serve_docs:main"
hed-format-docs = "scripts.format_docs:main"

[project.optional-dependencies]
docs = [
    "sphinx>=7.1.0,<10.0.0",
    "furo>=2024.1.29",
    "myst-parser>=3.0.0",
    "sphinx-design>=0.6.1",
    "sphinx-copybutton>=0.5.2",
    "linkify-it-py>=2.0.3",
]
dev = [
    "typos>=1.29.0",
    "ruff>=0.16.0",
    "mdformat>=0.7.0",
    "mdformat-myst>=0.1.5",
]

[project.urls]
Homepage = "https://www.hedtags.org"
Documentation = "https://www.hedtags.org/hed-resources"
Repository = "https://github.com/hed-standard/hed-resources"
Issues = "https://github.com/hed-standard/hed-resources/issues"
Changelog = "https://github.com/hed-standard/hed-resources/blob/main/CHANGELOG.md"
Specification = "https://www.hedtags.org/hed-specification"

# Tool configurations
[tool.typos.files]
extend-exclude = [
    "docs/_build",
    "docs/source/_static",
    "docs/source/_templates",
    "docs/source/hed-python",
    "docs/source/hed-matlab",
    "docs/source/hed-vis",
    "docs/source/hed-mcp",
    "docs/source/ndx-hed",
    "docs/source/table-remodeler",
    "docs/source/hed-schemas",
    "docs/source/hed-javascript",
    "docs/source/hed-server",
    "docs/source/hed-web",
    "docs/source/CTagger",
    "docs/deprecated",
    "submodules",
    ".venv",
]

[tool.typos.default.extend-words]
# Words that are intentional and should not be flagged
covert = "covert"
hed = "hed"
HED = "HED"
Hed = "Hed"
recuse = "recuse"
parms = "parms"

[tool.mdformat]
wrap = "no"  # Don't wrap lines (important for docs)
number = true  # Renumber ordered lists sequentially (matches CI --number flag)

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "docs/_build",
    "submodules",
    "docs/source/python-tools",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# __init__.py files: unused imports are re-exports, and their import order is
# often curated by hand to avoid circular imports - isort must not reorder them.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.format]
line-ending = "lf"
